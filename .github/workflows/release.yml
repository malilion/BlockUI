name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  NODE_VERSION: 24

jobs:
  publish:
    name: Publish @malilion/block-ui-* to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check tag matches package versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          status=0
          for pkg in packages/*/package.json; do
            version=$(node -p "require('./$pkg').version")
            if [ "$version" != "$tag" ]; then
              echo "::error file=$pkg::version $version does not match tag v$tag"
              status=1
            fi
          done
          exit $status

      - name: Unit tests
        run: pnpm test

      - name: Build packages
        run: pnpm build:packages

      - name: Tree-shake check
        run: pnpm check:treeshake

      - name: Package install check
        run: pnpm check:package

      - name: Check whether this version is already on npm
        id: published
        run: |
          missing=0
          for pkg in packages/*/package.json; do
            spec=$(node -p "const p=require('./$pkg'); p.name + '@' + p.version")
            if npm view "$spec" version >/dev/null 2>&1; then
              echo "$spec is already published"
            else
              echo "$spec is not published yet"
              missing=1
            fi
          done
          echo "missing=$missing" >> "$GITHUB_OUTPUT"

      - name: Publish
        # Skips cleanly when every package version already exists (e.g. a
        # release that was published manually before the tag was pushed).
        if: steps.published.outputs.missing == '1'
        run: pnpm -r --filter "./packages/**" publish --access public --no-git-checks --report-summary
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Signed build provenance (uses the id-token permission above).
          NPM_CONFIG_PROVENANCE: "true"
