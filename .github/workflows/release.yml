name: Release

# Every push to main checks whether the lockstep version in packages/*/package.json
# is on npm yet. If not, it tests, builds and publishes the missing packages with
# npm trusted publishing (OIDC, no token), then tags vX.Y.Z and creates the
# GitHub Release from the CHANGELOG section. Pushes that do not bump the version
# finish after the plan job.
#
# Publishing is split in two jobs because the npm trusted-publisher configs differ:
# tokens / themes trust release.yml with no GitHub environment, while icons / react
# were saved with the environment name "leave blank" (literally — npm's web form
# would not clear it). npm only accepts an OIDC token whose environment matches, so
# publish-ui runs in a GitHub environment of that name. If those configs are ever
# fixed (environment empty), move icons / react back into publish-core.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Each job asks for only what it needs; nothing is granted by default.
permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  NODE_VERSION: 24
  # Packages whose npm trusted publisher expects the GitHub environment below.
  UI_PACKAGES: icons react

jobs:
  plan:
    name: Plan release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      core: ${{ steps.split.outputs.core }}
      ui: ${{ steps.split.outputs.ui }}
      release-exists: ${{ steps.existing.outputs.exists }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Plan release
        id: plan
        run: node scripts/release-plan.mjs

      - name: Split packages by trusted-publisher config
        id: split
        # Keeps the publish order (tokens → themes → icons → react) within each group.
        run: |
          core=""
          ui=""
          for dir in ${{ steps.plan.outputs.packages }}; do
            if [[ " $UI_PACKAGES " == *" $dir "* ]]; then ui="$ui $dir"; else core="$core $dir"; fi
          done
          echo "core=${core# }" >> "$GITHUB_OUTPUT"
          echo "ui=${ui# }" >> "$GITHUB_OUTPUT"

      - name: Check for an existing GitHub Release
        id: existing
        run: |
          if gh release view "${{ steps.plan.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  publish-core:
    name: Publish tokens / themes
    needs: plan
    if: needs.plan.outputs.core != '' || needs.plan.outputs.ui != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing + provenance
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The full gate runs once here, before anything is published.
      - name: Unit tests
        run: pnpm test

      - name: Build packages
        run: pnpm build:packages

      - name: Tree-shake check
        run: pnpm check:treeshake

      - name: Package install check
        run: pnpm check:package

      - name: Publish
        if: needs.plan.outputs.core != ''
        # pnpm pack rewrites workspace:^ to the real version; npm publish then
        # authenticates through OIDC (trusted publishing needs npm >= 11.5.1).
        run: |
          npm install -g npm@11.21.0
          mkdir -p "$RUNNER_TEMP/packs"
          for dir in ${{ needs.plan.outputs.core }}; do
            tarball=$(cd "packages/$dir" && pnpm pack --pack-destination "$RUNNER_TEMP/packs" | tail -1)
            npm publish "$tarball" --access public --provenance
          done

  publish-ui:
    name: Publish icons / react
    needs: [plan, publish-core]
    if: needs.plan.outputs.ui != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing + provenance
    # Must equal the environment saved in the npm trusted-publisher config of
    # icons / react (see the note at the top of this file).
    environment: leave blank
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build:packages

      - name: Publish
        run: |
          npm install -g npm@11.21.0
          mkdir -p "$RUNNER_TEMP/packs"
          for dir in ${{ needs.plan.outputs.ui }}; do
            tarball=$(cd "packages/$dir" && pnpm pack --pack-destination "$RUNNER_TEMP/packs" | tail -1)
            npm publish "$tarball" --access public --provenance
          done

  github-release:
    name: Tag and create GitHub Release
    needs: [plan, publish-core, publish-ui]
    # Runs after a successful publish, or on its own when the version is already on npm.
    if: >
      always() && needs.plan.result == 'success' &&
      needs.plan.outputs.release-exists == 'false' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the vX.Y.Z tag and GitHub Release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Release notes
        run: node scripts/release-plan.mjs --notes "$RUNNER_TEMP/notes.md"

      - name: Create the tag and GitHub Release
        run: >
          gh release create "${{ needs.plan.outputs.tag }}"
          --target "$GITHUB_SHA"
          --title "${{ needs.plan.outputs.tag }}"
          --notes-file "$RUNNER_TEMP/notes.md"
        env:
          GH_TOKEN: ${{ github.token }}
