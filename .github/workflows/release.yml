name: Release

# Every push to main checks whether the lockstep version in packages/*/package.json
# is on npm yet. If not, it tests, builds and publishes the missing packages with
# npm trusted publishing (OIDC, no token), then tags vX.Y.Z and creates the
# GitHub Release from the CHANGELOG section. Pushes that do not bump the version
# finish after the plan step.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write # create the vX.Y.Z tag and GitHub Release
  id-token: write # npm trusted publishing + provenance

concurrency:
  group: release
  cancel-in-progress: false

env:
  NODE_VERSION: 24

jobs:
  release:
    name: Publish @malilion/block-ui-* to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Plan release
        id: plan
        run: node scripts/release-plan.mjs --notes "$RUNNER_TEMP/notes.md"

      - name: Check for an existing GitHub Release
        id: existing
        run: |
          if gh release view "${{ steps.plan.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install pnpm
        if: steps.plan.outputs.packages != ''
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        if: steps.plan.outputs.packages != ''
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        if: steps.plan.outputs.packages != ''
        run: pnpm test

      - name: Build packages
        if: steps.plan.outputs.packages != ''
        run: pnpm build:packages

      - name: Tree-shake check
        if: steps.plan.outputs.packages != ''
        run: pnpm check:treeshake

      - name: Package install check
        if: steps.plan.outputs.packages != ''
        run: pnpm check:package

      - name: Publish
        if: steps.plan.outputs.packages != ''
        # pnpm pack rewrites workspace:^ to the real version; npm publish then
        # authenticates through OIDC (trusted publishing needs npm >= 11.5.1).
        run: |
          npm install -g npm@^11.5.1
          mkdir -p "$RUNNER_TEMP/packs"
          for dir in ${{ steps.plan.outputs.packages }}; do
            tarball=$(cd "packages/$dir" && pnpm pack --pack-destination "$RUNNER_TEMP/packs" | tail -1)
            npm publish "$tarball" --access public --provenance
          done

      - name: Tag and create GitHub Release
        if: steps.existing.outputs.exists == 'false'
        run: >
          gh release create "${{ steps.plan.outputs.tag }}"
          --target "$GITHUB_SHA"
          --title "${{ steps.plan.outputs.tag }}"
          --notes-file "$RUNNER_TEMP/notes.md"
        env:
          GH_TOKEN: ${{ github.token }}
