packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true

# pnpm 11 reads overrides here, not from package.json "pnpm".
# jsdom 30.1.1 allows undici ^8.10.2 and the lockfile was stuck on 8.11.2.
overrides:
  undici: ">=8.12.2"

minimumReleaseAgeExclude:
  - globals@17.13.0
  - vite@8.3.2
  - "@malilion/block-ui-icons@0.6.1"
  - "@malilion/block-ui-react@0.6.1"
  - "@malilion/block-ui-themes@0.6.1"
  - "@malilion/block-ui-tokens@0.6.1"
